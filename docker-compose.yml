services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: lemma
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lemma"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Sandboxed code execution (Piston). Needs privileged mode for its isolation.
  # Runtimes are installed once with scripts/install-runtimes.sh.
  runner:
    image: ghcr.io/engineer-man/piston
    platform: linux/amd64
    privileged: true
    tmpfs:
      - /piston/jobs:exec,uid=1000,gid=1000,mode=711
    volumes:
      - pistondata:/piston/packages
    ports:
      - "2000:2000"

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:devpass@postgres:5432/lemma?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      RUNNER_URL: http://runner:2000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3001:3001"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  pgdata:
  pistondata: