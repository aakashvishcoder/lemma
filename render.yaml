services:
  - type: web
    name: lemma-server
    runtime: docker
    plan: free
    dockerfilePath: ./apps/server/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lemma-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: lemma-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      # The Vercel site URL, e.g. https://lemma.vercel.app (no trailing slash).
      # Render asks for this the first time the blueprint is created.
      - key: CORS_ORIGIN
        sync: false

  - type: keyvalue
    name: lemma-redis
    plan: free
    ipAllowList: []

databases:
  - name: lemma-db
    plan: free
    databaseName: lemma
